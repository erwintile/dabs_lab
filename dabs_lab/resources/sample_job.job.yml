# A sample job for live_demo.

resources:
  jobs:
    sample_job:
      name: sample_job

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: notebook_task_1
          notebook_task:
            notebook_path: ../src/sample_notebook.ipynb

        - task_key: notebook_task_2
          depends_on:
            - task_key: notebook_task_1
          notebook_task:
            notebook_path: ../src/sample_notebook.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
