bundle:
  name: dab_orders_demo

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog to deploy.
  schema_name:
    description: Base name of the bronze schema.
    default: bronze

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405606071868680.0.azuredatabricks.net
    variables:
      catalog: dev

  dev_shared:
    mode: production
    workspace:
      host: https://adb-7405606071868680.0.azuredatabricks.net
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_shared
      schema_name: bronze_shared

  prod:
    mode: production
    workspace:
      host: https://adb-7405616270532932.12.azuredatabricks.net/
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
