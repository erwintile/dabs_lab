bundle:
  name: dab_orders_demo

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog to deploy.
  schema_name:
    description: Base name of the bronze schema.
    default: bronze

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: <DEV_WORKSPACE_HOST>
    variables:
      catalog: dev

  dev_shared:
    mode: production
    workspace:
      host: <DEV_WORKSPACE_HOST>
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
    run_as:
      service_principal_name: <SP_DAB_DEV_APP_ID>
    permissions:
      - service_principal_name: <SP_DAB_DEV_APP_ID>
        level: CAN_MANAGE
      - group_name: <DEV_GROUP>
        level: CAN_VIEW

  prod:
    mode: production
    workspace:
      host: <PROD_WORKSPACE_HOST>
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
    run_as:
      service_principal_name: <SP_DAB_PROD_APP_ID>
    permissions:
      - service_principal_name: <SP_DAB_PROD_APP_ID>
        level: CAN_MANAGE
      - group_name: <DEV_GROUP>
        level: CAN_VIEW
